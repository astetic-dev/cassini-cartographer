  --font-head:Georgia,Cambria,"Times New Roman",Times,serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --radius:10px; --stroke:2px;
}

}

  --text:#ecdfc0; --text-strong:#f5ecd8; --text-muted:#b8a37d;
  --accent:#c99b4c; --accent-dim:#8f6a2c; --line:#3a2c18;
  --ok:#8fbf8f; --warn:#d9a24a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:15px;line-height:1.4;min-height:100vh}
h1{font-family:var(--font-head);font-size:19px;margin:0;letter-spacing:-.01em;color:var(--text-strong)}
code,.mono{font-family:var(--font-mono);font-size:.86em}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.counts{color:var(--text-muted);font-size:13px}
.maker{color:var(--text-muted);font-size:13px;font-style:italic}
#back{border-color:var(--accent);color:var(--accent)}
.counts b{color:var(--text);font-weight:600}
.spacer{flex:1 1 auto}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- warnings, read before any card ---- */
.warnings{margin:0;padding:12px 20px;border-bottom:1px solid var(--line);
  background:var(--surface-alt)}
.warnings ul{margin:0;padding-left:18px}
.warnings li{margin:2px 0;font-size:13.5px}
.tag{display:inline-block;font-family:var(--font-mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:1px 6px;border-radius:4px;
  border:1px solid currentColor;margin-right:6px}
.tag.ghost{color:var(--text-muted)} .tag.collision{color:var(--warn)}

/* ---- orientation: what territory is this? ---- */
.what{margin:0;padding:14px 20px 0;max-width:860px;color:var(--text)}
.what p{margin:0 0 8px;font-size:15px;line-height:1.5}
.what p:first-child{font-size:16.5px}
.what b{color:var(--text-strong)}
.what .shape{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);
  border-left:3px solid var(--line);padding-left:12px;margin-top:10px}

/* ---- after the map: the questions, and their answers ---- */
.ask{padding:18px 20px 28px;margin-top:10px;border-top:1px solid var(--line)}
.ask h2{font-family:var(--font-head);font-size:14px;margin:0 0 8px;color:var(--text-strong)}
.ask ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-width:860px}
.ask button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;
  padding:8px 12px;border-radius:8px}
.ask .q{flex:1 1 auto}
.ask .to{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
.ask button[aria-current="true"]{border-color:var(--accent);background:var(--surface-alt)}
.what .more{margin:2px 0 0}
.what .more summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.what .more p{margin:8px 0 0}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.topics button{border-radius:999px;padding:5px 14px;font-size:13.5px}
.topics button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
  background:var(--surface-alt);font-weight:600}
.blurb{margin:0 0 10px;font-size:13px;color:var(--text-muted);max-width:860px}

/* ---- the answer: prose the reader came for ---- */
.answer{margin:0 0 12px;padding:12px 14px;border-left:3px solid var(--accent);
  background:var(--surface);border-radius:0 8px 8px 0;max-width:860px}
.answer h3{margin:0 0 6px;font-size:15px;font-family:var(--font-head);color:var(--text-strong)}
.answer p{margin:0;font-size:14px;line-height:1.5}
.answer code{background:var(--surface-alt);padding:1px 4px;border-radius:3px}

/* ---- legend ---- */
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 20px 0;font-size:12.5px;

.legend span b{color:var(--text);font-weight:600}
.hint{padding:12px 20px 0;font-size:13px;color:var(--text-muted);max-width:760px}

main{padding:4px 20px 0}
.elabel{font-family:var(--font-mono);font-size:11px;fill:var(--text-muted);

.stage[data-mode="list"] .elabel{display:none}

.stage{position:relative;transform-origin:0 0}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

.node[data-st="ghost"]{border-style:dashed;border-color:var(--text-muted);background:transparent}

.stage[data-view="deep"] .node{opacity:.34}

.stage[data-view="deep"] .node[data-wave="origin"],

.stage[data-view="deep"] .edge[data-wave="stub"]{

.stage[data-view="deep"] .node[data-wave="blocked"]{opacity:.34;

@keyframes strike{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.hop{display:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}

/* ---- list mode ---- */
.stage[data-mode="list"] svg{display:none}
.stage[data-mode="list"]{display:flex;flex-direction:column;gap:8px;height:auto!important;transform:none!important}
.stage[data-mode="list"] .node{position:static;transform:none;width:auto}
.stage[data-mode="list"] .node[data-wave]{transform:none!important;animation:none!important}

/* ---- card panel ---- */
.panel{margin:14px 0 0;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface)}
.panel h2{margin:0 0 2px;font-size:16px;font-family:var(--font-head);color:var(--text-strong)}
.panel .src{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);cursor:pointer}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13.5px}
.panel dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-muted);padding-top:2px}
.panel dd{margin:0}
.panel .no{color:var(--warn)}
.dead{margin-top:10px;padding:8px 10px;border:1px dashed var(--text-muted);border-radius:6px;
  font-size:13px}

.lint{margin:14px 0 0;padding:8px 12px;border:1px solid var(--warn);border-radius:6px;
  font-size:13px;background:var(--surface)}
.lint summary{cursor:pointer;color:var(--warn)}
footer{margin-top:20px;padding:10px 20px 16px;border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}

  .hop{display:inline}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  var GW_MIN = 1600, GW = GW_MIN, GH_MIN = 900, GH = GH_MIN, SAFE = 80, NW = 184, NH = 58;
  var ROW = 96;   // vertical pitch per node: NH plus breathing room

  var byId = {}, edgeById = {};
  NOUNS.forEach(function (n) { byId[n.id] = n; });
  EDGES.forEach(function (e) { edgeById[e.id] = e; });

  var STATUS_GLYPH = { live: "●", leftover: "◑", ghost: "○" };
  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");

  // Lenses. A flat meta.questions array still works: it becomes one unnamed lens.
  var TOPICS = META.topics ||
    (META.questions ? [{ id: "all", label: "Questions", questions: META.questions }] : []);

  var state = { view: "overview", noun: null, topic: 0, q: null }, hasAsk = false;

  function currentQ() {
    var t = TOPICS[state.topic];
    if (!t || state.q == null) return null;
    return (t.questions || [])[state.q] || null;
  }

  function renderTopics() {
    var host = document.getElementById("ask");
    var t = TOPICS[state.topic] || TOPICS[0];
    var tabs = TOPICS.map(function (x, i) {
      return '<button data-topic="' + i + '" aria-pressed="' + (i === state.topic ? "true" : "false") +
        '">' + esc(x.label) + "</button>";
    }).join("");
    var list = (t.questions || []).map(function (q, i) {
      var n = byId[q.id];
      var here = state.view === "deep" && q.id === state.noun;
      return '<li><button data-goto="' + esc(q.id) + '" data-q="' + i + '"' +
        (here ? ' aria-current="true"' : "") + '><span class="q">' +
        esc(q.q) + '</span><span class="to">' + esc(n ? n.name : q.id) + " &rarr;</span></button></li>";
    }).join("");
    host.innerHTML = "<h2>What do you want to talk about?</h2>" +
      '<div class="topics">' + tabs + "</div>" +
      (t.blurb ? '<p class="blurb">' + esc(t.blurb) + "</p>" : "") +
      "<ul>" + list + "</ul>";
  }
  var placed = [], nodeEls = {}, edgeEls = {}, labelEls = {};

  // ---- layout: layered left-to-right, deterministic ------------------------
  function layout(nouns, edges) {
    var ix = {}, i;
    nouns.forEach(function (n, k) { ix[n.id] = k; });
    var out = nouns.map(function () { return []; });
    var inn = nouns.map(function () { return []; });
    edges.forEach(function (e) {
      var a = ix[e.from], b = ix[e.to];
      if (a == null || b == null || a === b) return;
      out[a].push(b); inn[b].push(a);
    });

    // Columns come from a longest-path rank, and that needs a graph with no
    // cycles. A real territory is never one: the window calls down, the process
    // pushes back up, and the two close a loop. Walk depth-first and leave out
    // the edge that closes each loop - for ranking only. Every edge is still
    // drawn. Without this the rank keeps climbing round the loop until a guard
    // stops it, and the whole graph ends up crushed into the last few columns,
    // on top of itself.
    var colour = nouns.map(function () { return 0; });      // 0 new, 1 on the walk, 2 done
    var dag = nouns.map(function () { return []; });
    var seen = nouns.map(function () { return {}; });
    function walk(v) {
      colour[v] = 1;
      out[v].forEach(function (w) {
        if (colour[w] === 1) return;                        // closes a loop
        if (!seen[v][w]) { seen[v][w] = 1; dag[v].push(w); }
        if (colour[w] === 0) walk(w);
      });
      colour[v] = 2;
    }
    // Start where things start: fewest ways in first, so the entry points of the
    // territory land on the left rather than whichever noun was written first.
    nouns.map(function (_, k) { return k; })
      .sort(function (a, b) { return (inn[a].length - inn[b].length) || (a - b); })
      .forEach(function (k) { if (colour[k] === 0) walk(k); });

    var indeg = nouns.map(function () { return 0; });
    dag.forEach(function (list) { list.forEach(function (w) { indeg[w]++; }); });
    var rank = nouns.map(function () { return 0; });
    var queue = [], head = 0;
    nouns.forEach(function (_, k) { if (!indeg[k]) queue.push(k); });
    while (head < queue.length) {
      var v = queue[head++];
      dag[v].forEach(function (w) {
        if (rank[w] < rank[v] + 1) rank[w] = rank[v] + 1;
        if (--indeg[w] === 0) queue.push(w);
      });
    }
    var maxRank = 0;
    rank.forEach(function (r) { if (r > maxRank) maxRank = r; });
    // an unconnected noun is itself a finding: place it, never hide it
    nouns.forEach(function (_, k) { if (!out[k].length && !inn[k].length) rank[k] = maxRank + 1; });
    // Close the gaps. An empty column still takes its share of the width, and
    // the nouns either side of it get squeezed together to pay for it.
    var used = [];
    rank.forEach(function (r) { if (used.indexOf(r) < 0) used.push(r); });
    used.sort(function (a, b) { return a - b; });
    rank = rank.map(function (r) { return used.indexOf(r); });
    var cols = [];
    rank.forEach(function (r, k) { (cols[r] = cols[r] || []).push(k); });
    var pos = nouns.map(function () { return 0; });
    cols.forEach(function (c) { c.forEach(function (k, j) { pos[k] = j; }); });
    for (var sweep = 0; sweep < 2; sweep++) {
      cols.forEach(function (col) {
        if (!col) return;
        col.sort(function (a, b) {
          var na = out[a].concat(inn[a]), nb = out[b].concat(inn[b]);
          var ba = na.length ? na.reduce(function (s, j) { return s + pos[j]; }, 0) / na.length : pos[a];
          var bb = nb.length ? nb.reduce(function (s, j) { return s + pos[j]; }, 0) / nb.length : pos[b];
          return (ba - bb) || (nouns[a].id < nouns[b].id ? -1 : 1);
        });
        col.forEach(function (k, j) { pos[k] = j; });
      });
    }
    // The stage grows to fit the busiest column. A fixed height silently
    // overlaps nodes as soon as one column gets crowded, and an overlapping
    // graph is worse than no graph.
    var maxCol = 1;
    cols.forEach(function (c) { if (c && c.length > maxCol) maxCol = c.length; });
    GH = Math.max(GH_MIN, maxCol * ROW + 2 * SAFE);

    // A column narrower than a node is a column of overlapping nodes. Widen the
    // stage instead - it is scaled to the reader's width on the way out.
    var nc = Math.max(cols.length, 1);
    var colW = Math.max(NW + 46, (GW_MIN - 2 * SAFE) / nc);
    GW = Math.round(2 * SAFE + colW * nc);
    return nouns.map(function (n, k) {
      var m = cols[rank[k]].length;
      return {
        n: n, rank: rank[k], row: pos[k],
        x: SAFE + colW * (rank[k] + 0.5),
        y: SAFE + (GH - 2 * SAFE) * ((pos[k] + 0.5) / m)
      };
    });
  }

  // A label is the content of an edge - it says HOW two things reach each other -
  // so it may not be dropped when it collides. Nudge it clear instead: off the
  // nodes first, then off the labels already placed. Found by screenshotting a
  // finished map and reading it, which is the only way this kind of fault shows.
  function deconflictLabels() {
    var boxes = placed.map(function (p) {
      return { x0: p.x - NW / 2 - 6, x1: p.x + NW / 2 + 6, y0: p.y - 54, y1: p.y + 54 };
    });
    function clashes(b) {
      return boxes.some(function (o) {
        return !(b.x1 < o.x0 || b.x0 > o.x1 || b.y1 < o.y0 || b.y0 > o.y1);
      });
    }
    Object.keys(labelEls).forEach(function (k) {
      var t = labelEls[k];
      var w = (t.textContent || "").length * 6.7, h = 15;
      var x = parseFloat(t.getAttribute("x")) || 0, y = parseFloat(t.getAttribute("y")) || 0;
      var steps = [0, -20, 20, -40, 40, -62, 62, -84, 84, -108, 108];
      for (var i = 0; i < steps.length; i++) {
        var yy = y + steps[i];
        var b = { x0: x - w / 2, x1: x + w / 2, y0: yy - h, y1: yy + 5 };
        if (!clashes(b) || i === steps.length - 1) { t.setAttribute("y", yy); boxes.push(b); break; }
      }
    });
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // The three status values are the machine-readable field. On the page a reader
  // gets the sentence, never the field value.
  function plainStatus(v) {
    return v === "ghost" ? "never wired"
         : v === "leftover" ? "no longer used"
         : v === "live" ? "in use" : String(v == null ? "" : v);
  }

  // Escape first, then re-admit exactly two marks: `code` and **bold**. Generated
  // text is still text; nothing here is ever injected as raw HTML.
  function mark(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }

  // ---- build the stage once ----------------------------------------------
  function build() {
    placed = layout(NOUNS, EDGES);
    var stage = document.getElementById("stage"), svg = document.getElementById("wires");
    stage.style.width = GW + "px"; stage.style.height = GH + "px";
    svg.setAttribute("viewBox", "0 0 " + GW + " " + GH);

    var pos = {};
    placed.forEach(function (p) { pos[p.n.id] = p; });

    EDGES.forEach(function (e, ei) {
      var a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      var dx = Math.max(40, (b.x - a.x) * 0.45), d;
      if (b.rank > a.rank) {
        d = "M" + (a.x + NW / 2) + "," + a.y + " C" + (a.x + NW / 2 + dx) + "," + a.y +
            " " + (b.x - NW / 2 - dx) + "," + b.y + " " + (b.x - NW / 2) + "," + b.y;
      } else {
        d = "M" + a.x + "," + (a.y + NH / 2) + " C" + a.x + "," + (a.y + NH / 2 + 150) +
            " " + b.x + "," + (b.y + NH / 2 + 150) + " " + b.x + "," + (b.y + NH / 2);
      }
      path.setAttribute("d", d);
      path.setAttribute("class", "edge");
      path.setAttribute("data-st", e.status || "live");
      path.setAttribute("data-id", e.id);
      svg.appendChild(path);
      try { path.style.setProperty("--len", path.getTotalLength()); } catch (_) {}
      edgeEls[e.id] = path;

      // the label IS the "how it moves" content. Without it the graph only says
      // that two things touch, which is the complaint a reader makes first.
      if (e.label) {
        // Not all at the midpoint: edges that share a pair of endpoints put
        // their labels in the same spot, and two labels in one spot are one
        // unreadable label.
        var frac = 0.5 + (((ei % 3) - 1) * 0.13);
        var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 7 };
        try { var p = path.getPointAtLength(path.getTotalLength() * frac); mid.x = p.x; mid.y = p.y - 7; }
        catch (_) {}
        var tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tx.setAttribute("class", "elabel");
        tx.setAttribute("x", mid.x); tx.setAttribute("y", mid.y);
        tx.setAttribute("text-anchor", "middle");
        tx.setAttribute("data-id", e.id);
        tx.textContent = e.label;
        svg.appendChild(tx);
        labelEls[e.id] = tx;
      }
    });

    placed.forEach(function (p) {
      var n = p.n;
      var b = document.createElement("button");
      b.className = "node";
      b.setAttribute("data-st", n.status);
      b.setAttribute("data-goto", n.id);
      b.style.left = p.x + "px"; b.style.top = p.y + "px";
      b.innerHTML =
        '<span class="nm">' + esc(n.name) + "</span>" +
        '<span class="sm">' + esc(n.summary || "") + "</span>" +
        '<span class="st">' + STATUS_GLYPH[n.status] + " " + esc(plainStatus(n.status)) +
          (n.reach ? " · " + esc(n.reach) : "") + "</span>" +
        '<span class="hop"></span><span class="strike"></span>';
      stage.appendChild(b);
      nodeEls[n.id] = b;
    });

    deconflictLabels();
  }

  // ---- the wave -----------------------------------------------------------
  function buildWave(origin) {
    var nodeRing = {}, edgeRing = {};
    nodeRing[origin.id] = 0;
    (origin.hits || []).forEach(function (hit) {
      var cur = origin.id, d = 0;
      (hit.via || []).forEach(function (eid) {
        var e = edgeById[eid];
        if (!e) return;
        var next = e.from === cur ? e.to : e.from;
        if (edgeRing[eid] == null || d < edgeRing[eid]) edgeRing[eid] = d;
        d += 1;
        if (nodeRing[next] == null || d < nodeRing[next]) nodeRing[next] = d;
        cur = next;
      });
      if (!(hit.via || []).length && hit.id) {
        if (nodeRing[hit.id] == null) nodeRing[hit.id] = 1;
      }
    });
    var rings = [];
    Object.keys(nodeRing).forEach(function (id) {
      var d = nodeRing[id];
      (rings[d] = rings[d] || []).push(id);
    });
    rings.forEach(function (r) { if (r) r.sort(); });
    return { rings: rings, edgeRing: edgeRing, nodeRing: nodeRing };
  }

  function schedule(origin, wave) {
    var steps = [], settled = 0;
    wave.rings.forEach(function (ids, d) {
      if (!ids) return;
      ids.forEach(function (id, i) {
        var delay = d * BEAT + Math.min(i, 2) * STAG;
        if (delay > settled) settled = delay;
        steps.push({ kind: id === origin.id ? "origin" : "hit", id: id, delay: delay, hop: d });
      });
    });
    Object.keys(wave.edgeRing).forEach(function (eid) {
      steps.push({ kind: "edge", id: eid, delay: wave.edgeRing[eid] * BEAT + HALF / 2 });
    });
    settled += BEAT;
    var dnh = origin.doesNotHit;
    if (dnh && dnh.id) {
      steps.push({ kind: "blocked", id: dnh.id, delay: settled });
      EDGES.forEach(function (e) {
        if (e.from === dnh.id || e.to === dnh.id) steps.push({ kind: "stub", id: e.id, delay: settled });
      });
    }
    return { steps: steps, totalMs: settled + 2 * BEAT };
  }

  function clearWave() {
    Object.keys(nodeEls).forEach(function (k) {
      nodeEls[k].removeAttribute("data-wave");
      nodeEls[k].style.removeProperty("--delay");
      nodeEls[k].querySelector(".hop").textContent = "";
    });
    Object.keys(edgeEls).forEach(function (k) {
      edgeEls[k].removeAttribute("data-wave");
      edgeEls[k].style.removeProperty("--delay");
    });
    Object.keys(labelEls).forEach(function (k) { labelEls[k].removeAttribute("data-wave"); });
  }

  function play(originId) {
    var origin = byId[originId];
    if (!origin) return;
    clearWave();
    void document.getElementById("stage").offsetWidth;
    var sched = schedule(origin, buildWave(origin));
    sched.steps.forEach(function (s) {
      var isEdge = (s.kind === "edge" || s.kind === "stub");
      var el = isEdge ? edgeEls[s.id] : nodeEls[s.id];
      if (!el) return;
      el.style.setProperty("--delay", (reduceMq.matches ? 0 : s.delay) + "ms");
      el.setAttribute("data-wave", s.kind);
      if (isEdge && labelEls[s.id]) labelEls[s.id].setAttribute("data-wave", s.kind);
      if (s.hop != null && el.querySelector) {
        var h = el.querySelector(".hop");
        if (h) h.textContent = s.hop === 0 ? "origin" : s.hop + (s.hop === 1 ? " hop" : " hops");
      }
    });
    var dnh = origin.doesNotHit && byId[origin.doesNotHit.id];
    document.getElementById("live").textContent =
      origin.name + " hits " + (origin.hits || []).length + " nouns." +
      (dnh ? " It does not hit " + dnh.name + "." : "");
  }

  // ---- views --------------------------------------------------------------
  function renderPanel() {
    var host = document.getElementById("panel");
    if (state.view !== "deep") { host.innerHTML = ""; return; }
    var n = byId[state.noun];
    if (!n) { host.innerHTML = ""; return; }
    var dnh = n.doesNotHit || {};
    var dnhName = byId[dnh.id] ? byId[dnh.id].name : dnh.id;
    var nHits = (n.hits || []).length;
    // The answer comes first. A reader who clicked a question wants prose, not a
    // field list — the card fields are the evidence under it.
    var q = currentQ();
    var html = "";
    if (q && q.answer) {
      // Escape first, then re-admit backticks as <code>. Never inject the answer
      // as raw HTML: it is generated text, and generated text still gets escaped.
      html += '<div class="answer"><h3>' + esc(q.q) + "</h3><p>" + mark(q.answer) + "</p></div>";
    }
    html += '<div class="panel"><h2>' + esc(n.name) + "</h2>" +
      '<span class="src" data-select>' + esc(n.source || "") + " · " + esc(n.card || "") + "</span>" +
      '<p style="margin:10px 0 0;font-size:14px">' + (
        nHits
          ? "If you change <b>" + esc(n.name) + "</b>, <b>" + nHits + "</b> other thing" +
            (nHits === 1 ? " moves" : "s move") +
            (dnhName ? " &mdash; but <b>" + esc(dnhName) + "</b> does not, even though it looks like it should." : ".")
          : "Changing <b>" + esc(n.name) + "</b> moves nothing else on this map." +
            (dnhName ? " Not even <b>" + esc(dnhName) + "</b>, which is the thing most readers expect it to reach." : "")
      ) + "</p><dl>";
    html += "<dt>what it is</dt><dd>" + esc(n.summary || "") + "</dd>";
    html += "<dt>kind</dt><dd>" + esc(n.type) + " · " + esc(plainStatus(n.status)) +
      (n.reach ? " · reached from " + esc(n.reach) : "") + "</dd>";
    if ((n.hits || []).length) {
      html += "<dt>what moves with it</dt><dd>" + n.hits.map(function (h) {
        return "<b>" + esc(byId[h.id] ? byId[h.id].name : h.id) + "</b> &mdash; " + esc(h.why);
      }).join("<br>") + "</dd>";
    }
    if (dnh.id) {
      html += '<dt>looks connected, is not</dt><dd class="no"><b>' + esc(dnhName) + "</b> &mdash; " + esc(dnh.why) + "</dd>";
    }
    html += "</dl>";
    (n.dead || []).forEach(function (d) {
      html += '<div class="dead"><b>' + esc(d.name) + "</b> &mdash; " + esc(plainStatus(d.status)) +
        " &mdash; " + esc(d.at) + (d.why ? " &mdash; " + esc(d.why) : "") + "</div>";
    });
    html += "<p style='margin:10px 0 0;font-size:12.5px;color:var(--text-muted)'>" +
      "This is a view. The card is " + esc(n.card || "") + ".</p>" +
      "<p style='margin:12px 0 0'><button data-back>&larr; back to the map</button></p></div>";
    host.innerHTML = html;
  }

  function render() {
    var stage = document.getElementById("stage");
    stage.setAttribute("data-view", state.view);
    // The title doubles as the breadcrumb: a reader three clicks in can always
    // see where they are without hunting for a control in a corner.
    var here = state.view === "deep" && byId[state.noun] ? byId[state.noun].name : null;
    document.getElementById("title").textContent =
      (META.title || "System map") + (here ? " · " + here : "");
    document.getElementById("back").hidden = state.view !== "deep";
    document.getElementById("replay").hidden = state.view !== "deep";
    // The questions are the way around this page, so they never go away: a
    // reader inside a card can step straight to another question without
    // finding their way back to the map first.
    if (hasAsk) renderTopics();
    document.getElementById("hint").hidden = state.view === "deep";
    if (META.is) document.getElementById("what").hidden = state.view === "deep";
    if (state.view === "deep") { play(state.noun); } else { clearWave(); }
    renderPanel();
    fit();
  }

  function go(view, noun, q) {
    state.view = view; state.noun = noun || null; state.q = (q == null ? null : q);
    try { location.hash = view === "deep" ? "/n/" + noun : "/"; } catch (_) {}
    render();
  }

  // ---- fit and list mode --------------------------------------------------
  function fit() {
    var wrap = document.getElementById("stagewrap"), stage = document.getElementById("stage");
    var w = wrap.clientWidth || GW;
    if (w < 640) {
      stage.setAttribute("data-mode", "list");
      stage.style.transform = "none";
      wrap.style.height = "auto";
      return;
    }
    stage.removeAttribute("data-mode");
    var k = Math.min(1, w / GW);
    stage.style.transform = "scale(" + k + ")";
    wrap.style.height = (GH * k) + "px";
  }

  // ---- chrome -------------------------------------------------------------
  function chrome() {
    document.getElementById("title").textContent = META.title || "System map";
    if (META.maker) {
      var mk = document.getElementById("maker");
      mk.textContent = META.maker;
      mk.hidden = false;
    }
    // Dead members are deduped by name: the same ghost is often cited on more
    // than one card (its owning noun, and the surface that registers it). Counting
    // the citations instead of the things is how a view starts disagreeing with
    // its own map.
    var ghostNames = {};
    NOUNS.forEach(function (n) {
      if (n.status === "ghost") ghostNames[n.id] = 1;
      (n.dead || []).forEach(function (d) { if (d.status === "ghost") ghostNames[d.name] = 1; });
    });
    var leftNames = {};
    NOUNS.forEach(function (n) {
      if (n.status === "leftover") leftNames[n.id] = 1;
      (n.dead || []).forEach(function (d) { if (d.status === "leftover") leftNames[d.name] = 1; });
    });
    // A dead edge is only its own finding when BOTH endpoints are alive - a live
    // noun with a dead output. An edge into a ghost node is the same fact as the
    // ghost node, and counting it twice reads as a contradiction.
    var deadEdges = EDGES.filter(function (e) {
      return e.status === "ghost" && !ghostNames[e.from] && !ghostNames[e.to];
    }).length;
    // Plain words on the sheet. The field values live in the data; a reader is
    // never asked to learn 'ghost' and 'leftover' to read their own map.
    var nGhost = Object.keys(ghostNames).length, nLeft = Object.keys(leftNames).length;
    document.getElementById("counts").innerHTML =
      "<b>" + NOUNS.length + "</b> part" + (NOUNS.length === 1 ? "" : "s") +
      " · <b>" + EDGES.length + "</b> connection" + (EDGES.length === 1 ? "" : "s") +
      (nGhost ? " · <b>" + nGhost + "</b> never wired" : "") +
      (nLeft ? " · <b>" + nLeft + "</b> no longer used" : "") +
      (deadEdges ? " · <b>" + deadEdges + "</b> connection" + (deadEdges === 1 ? "" : "s") +
        " nothing is listening on" : "");

    var warn = [], seenWarn = {};
    NOUNS.forEach(function (n) {
      (n.dead || []).forEach(function (d) {
        if (seenWarn[d.name]) return;          // same ghost, cited on two cards
        seenWarn[d.name] = 1;
        warn.push('<li><span class="tag ghost">' + esc(plainStatus(d.status)) + "</span><code>" + esc(d.name) +
          "</code> (" + esc(d.at) + ") &mdash; " + esc(d.why || "on the surface, called by nothing") +
          " → <code>" + esc(n.card || "") + "</code></li>");
      });
    });
    (META.collisions || []).forEach(function (c) {
      warn.push('<li><span class="tag collision">collision</span><code>' + esc(c.word) +
        "</code> means " + esc(c.count) + " different things here → <code>" +
        esc(c.file || "collisions.md") + "</code></li>");
    });
    if (warn.length) {
      var w = document.getElementById("warnings");
      w.innerHTML = "<strong style='font-size:13px'>Read before any card</strong><ul>" +
        warn.join("") + "</ul>";
      w.hidden = false;
    }

    // Orientation before anything else. A reader who does not know what the
    // territory IS cannot use a graph of its parts, however accurate.
    if (META.is || (META.explainer && META.explainer.length)) {
      var w = document.getElementById("what");
      var bits = [];
      if (META.is) bits.push("<p><b>" + esc(META.title || "This") + "</b> " + mark(META.is) + "</p>");
      // The opening paragraph, then the rest folded away. The whole description
      // is the catalog's job; on this page the map has to stay above the fold,
      // or the reader scrolls past the thing they came to look at.
      if (META.explainer && META.explainer.length) {
        bits.push('<details class="more"><summary>the rest of the description</summary>' +
          META.explainer.map(function (para) { return "<p>" + mark(para) + "</p>"; }).join("") +
          "</details>");
      }
      if (META.shape) bits.push('<p class="shape">' + mark(META.shape) + "</p>");
      w.innerHTML = bits.join("");
      w.hidden = false;
    }

    // The front door. A reader arrives with a question, not with a diagram, and
    // they arrive wanting to talk about ONE aspect. Lenses group the questions;
    // each question carries the answer, because a highlight on a graph is not an
    // answer to anything.
    if (TOPICS.length) {
      hasAsk = true;
      document.getElementById("ask").hidden = false;
      renderTopics();
    }

    document.getElementById("hint").textContent =
      "Each box below is something you can change. Click one to see what moves when you " +
      "touch it, and which nearby thing looks connected but is not. The label on a line " +
      "is how the two actually reach each other.";

    var reaches = [];
    NOUNS.forEach(function (n) { if (n.reach && reaches.indexOf(n.reach) < 0) reaches.push(n.reach); });
    document.getElementById("legend").innerHTML =
      "<span>● <b>in use</b> — changing it changes what happens today</span>" +
      (Object.keys(leftNames).length
        ? "<span>◑ <b>no longer used</b> — did a real job once, inert now</span>" : "") +
      (Object.keys(ghostNames).length
        ? "<span>○ <b>never wired</b> — looks finished, nothing calls it</span>" : "") +
      (reaches.length
        ? "<span><b>" + reaches.map(esc).join("</b> / <b>") + "</b> — who can reach it</span>" : "");

    if (LINT.length) {
      document.getElementById("lint").innerHTML =
        '<details class="lint"><summary>' + LINT.length + " finding" + (LINT.length === 1 ? "" : "s") +
        " where this view disagrees with the cards</summary><ul>" +
        LINT.map(function (l) {
          return "<li><code>" + esc(l.code) + "</code> &mdash; " + esc(l.message) +
            " &mdash; <code>" + esc(l.at || l.noun || "") + "</code></li>";
        }).join("") + "</ul></details>";
    }

    document.getElementById("prov").textContent =
      "a view of " + (META.cardsDir || "objects") + "/ — " + NOUNS.length + " cards · " +
      "walked " + (META.surveyed || "?") + " at " + (META.at || "?") + " · " +
      (META.territoryFiles || "?") + " files, " + (META.territoryLines || "?") + " lines · " +
      "DO NOT EDIT — regenerate from the cards";
  }

  // ---- wiring -------------------------------------------------------------
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var sel = t.closest && t.closest("[data-select]");
    if (sel) { try { getSelection().selectAllChildren(sel); } catch (_) {} return; }
    var tp = t.closest && t.closest("[data-topic]");
    if (tp) { state.topic = parseInt(tp.getAttribute("data-topic"), 10); state.q = null; renderTopics(); return; }
    var el = t.closest && t.closest("[data-goto]");
    if (el) {
      ev.preventDefault();
      var qi = el.getAttribute("data-q");
      go("deep", el.getAttribute("data-goto"), qi === null ? null : parseInt(qi, 10));
      return;
    }
    if (t.id === "back" || (t.closest && t.closest("[data-back]"))) { go("overview"); return; }
    // Three ways back, because one control in one corner is not navigation:
    // the button, Escape, and clicking the empty page around the diagram.
    if (state.view === "deep" && (t.id === "stagewrap" || t.id === "stage" || t.id === "wires")) {
      go("overview"); return;
    }
    if (t.id === "replay") { play(state.noun); return; }
    if (t.id === "theme") {
      var r = document.documentElement;
      var now = r.getAttribute("data-theme");
      r.setAttribute("data-theme", now === "dark" ? "light" : "dark");
      return;
    }
  }, false);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.view === "deep") go("overview");
  });

  // The browser's own back button. `history.pushState` throws in the sandboxed
  // frame this page has to survive, but writing `location.hash` does not - and
  // every hash write already leaves a history entry. Reconciling state against
  // the hash instead of locking a flag makes our own writes a no-op here, so the
  // handler needs no guard.
  function fromHash() {
    try {
      var m = /^#\/n\/([\w.-]+)$/.exec(location.hash || "");
      return m && byId[m[1]] ? m[1] : null;
    } catch (_) { return null; }
  }

  window.addEventListener("hashchange", function () {
    var n = fromHash(), want = n ? "deep" : "overview";
    if (want === state.view && (n || null) === (state.noun || null)) return;
    state.view = want; state.noun = n; state.q = null;
    render();
  });

  if (window.ResizeObserver) {
    new ResizeObserver(fit).observe(document.getElementById("stagewrap"));
  } else {
    window.addEventListener("resize", fit);
  }
  if (reduceMq.addEventListener) reduceMq.addEventListener("change", render);

  build();
  chrome();
  var boot = fromHash();
  if (boot) { state.view = "deep"; state.noun = boot; }
  render();

  window.__map = {
    layout: function () { return placed; },
    wave: function (id) { var o = byId[id]; return o ? schedule(o, buildWave(o)) : null; },
    data: MAP
  };
})();
</script>
</body>
</html>
